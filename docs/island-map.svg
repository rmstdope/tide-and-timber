<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1160" viewBox="0 0 1640 1160" role="img" aria-labelledby="title desc">
  <title id="title">Tide and Timber: island story map</title>
  <desc id="desc">Proposed spoiler-filled island map. Begin on the southern beach, cross Lantern Woods to Hearthvale village, then restore a route into the eastern jungle. Four farming-gated buried engines occupy the southeast, northeast, north, and west. Restoration opens return paths to the village. All four engines power the sealed control room under Stillheart Hill. Village visits support stages 3, 7, 9, 12, 15, and 17. The epilogue is on another world. A separate interior schematic shows power links rather than walking routes.</desc>
