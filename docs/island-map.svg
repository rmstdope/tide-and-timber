  <path d="M1322 335H1462" stroke="#c3b398" stroke-width="2"/>
  <text x="1392" y="357" text-anchor="middle" class="small pale">G6 / final farm remedy</text>
  <text x="1392" y="384" text-anchor="middle" class="label pale">16 / dark heart</text>
  <text x="1194" y="462" class="small pale">Visit outer room, return home for stage 15.</text>
  <text x="1194" y="487" class="small pale">Fight to the source. Cure it. Then launch.</text>

  <rect x="1171" y="537" width="441" height="229" rx="16" fill="#e5d9b7"/>
  <text x="1194" y="572" class="region">THE GROWING JOURNEY</text>
  <text x="1194" y="603" class="small">G0  First remedy / opens the jungle</text>
  <text x="1194" y="631" class="small">G1  Wet beds + filtering reeds</text>
  <text x="1194" y="659" class="small">G2  Irrigation + climbing plants</text>
  <text x="1194" y="687" class="small">G3  Sheltered beds + warming plants</text>
  <text x="1194" y="715" class="small">G4  Luminous companion ecosystem</text>
  <text x="1194" y="747" class="tiny">All ingredients are reachable before their own gate.</text>

  <rect x="1171" y="783" width="441" height="207" rx="16" fill="#d9e1bc"/>
  <text x="1194" y="818" class="region">18 / THE FIRST GARDEN</text>
  <text x="1194" y="848" class="small">Another world. A short epilogue.</text>
