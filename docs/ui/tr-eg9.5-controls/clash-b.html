<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const head=`<div class="r head"><span class="n"></span><span class="c">Keyboard</span><span class="c">Controller</span></div>`;const rows=(sel,cell,sub={})=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span><span class="c"><span class="cell${i==sel&&cell==0?" on":""}">${sub[i+"k"]||a[1][0]}</span></span><span class="c"><span class="cell${i==sel&&cell==1?" on":""}">${sub[i+"p"]||a[2][0]}</span></span></div>`).join("");const L=(s,c,sub)=>`<div class="list">${head}${rows(s,c,sub)}<div class="r"><span class="n">Reset to defaults</span></div></div>`;page("Option B — the other action loses its key","Build list gives B up and is left with no key, marked in orange, until the player gives it one. Leaving the page with an action unset is allowed but warned.",[
["After pressing B for Use / take",scr(L(5,0,{"5k":K("B"),"6k":"<span class=warn>— none —</span>"})+`<div class="msg warn">Build list has no key</div>`+hint(K("Enter")+"Change "+K("Esc")+"Back")),""],
["Leaving with an unset action",scr(L(8,0,{"5k":K("B"),"6k":"<span class=warn>— none —</span>"})+`<div class="dim"></div><div class="box"><div>Build list has no key.</div><div>Leave anyway?</div><div class="bb"><span class="sel">Set a key</span><span>Leave</span></div></div>`),""]]);</script></body>
