<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const M=[["Menu select",[K("Enter")],[A]],["Menu back",[K("Esc")],[B]]];const rows=ACT.concat(M).map((a,i)=>`<div class="r${i==8?" sel":""}" style="height:17px;margin:2px 0"><span class="n">${a[0]}</span><span class="c">${a[1][0]}</span><span class="c">${a[2][0]}</span></div>`).join("");
page("Option C — everything, menus too","Menu select and Menu back join the list and can be changed as well. Complete control, but a player can give Menu back a key they then forget, and the page gets long enough to scroll at larger UI sizes. To stay safe, Enter, Esc, A and B would still work in menus as spares.",[
["",scr(`<div class="list" style="top:44px">${rows}<div class="r" style="height:17px;margin:2px 0"><span class="n">Reset to defaults</span></div></div>`+hint(K("Enter")+"Change "+K("Esc")+"Back")),"Ten rows plus reset."]]);</script></body>
