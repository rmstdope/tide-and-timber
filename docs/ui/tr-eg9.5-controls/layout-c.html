<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const rows=(sel,cell)=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span>${[a[1][0],a[1][1]||"<span class=lock>—</span>",a[2][0]].map((v,j)=>`<span class="c" style="width:95px"><span class="cell${i==sel&&cell==j?" on":""}">${v}</span></span>`).join("")}</div>`).join("");
const head=`<div class="r head"><span class="n"></span><span class="c" style="width:95px">Key</span><span class="c" style="width:95px">Other key</span><span class="c" style="width:95px">Controller</span></div>`;
page("Option C — one list, two keyboard slots and a controller button","Everything on one page, like A, but every action has room for a second key, so the arrow keys are ordinary changeable keys. Left/right move across three slots. Most complete; the busiest page.",[
["Opened with the keyboard",scr(`<div class="list" style="left:30px;right:30px">${head}${rows(0,1)}<div class="r"><span class="n">Reset to defaults</span></div></div>`+hint(K("Enter")+"Change "+K("Esc")+"Back")),"An empty slot shows a dash."],
["On a controller slot",scr(`<div class="list" style="left:30px;right:30px">${head}${rows(6,2)}<div class="r"><span class="n">Reset to defaults</span></div></div>`+hint(A+"Change "+B+"Back")),""]]);</script></body>
