<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const tab=t=>`<div class="tabs"><span class="${t==0?"on":""}">Keyboard</span><span class="${t==1?"on":""}">Controller</span></div>`;
const rows=(sel,col)=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span><span class="c">${a[col].join(" ")}</span></div>`).join("");
page("Option B — two tabs, Keyboard and Controller","One device at a time. The page opens on the tab of the device used last; LB/RB or Q/E switch tabs. Each keyboard action can hold two keys (W and ↑). Quieter rows, but one more thing to learn (the tab switch keys).",[
["Opened after using the keyboard",scr(tab(0)+`<div class="list" style="top:66px">${rows(5,1)}<div class="r"><span class="n">Reset keyboard to defaults</span></div></div>`+hint(K("Q")+K("E")+"Tab "+K("Enter")+"Change "+K("Esc")+"Back")),"Walk rows show both keys; each of the two can be changed."],
["Opened after using the pad",scr(tab(1)+`<div class="list" style="top:66px">${rows(5,2)}<div class="r"><span class="n">Reset controller to defaults</span></div></div>`+hint(LB+RB+"Tab "+A+"Change "+B+"Back")),"Reset only resets this tab."]]);</script></body>
