<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const head=`<div class="r head"><span class="n"></span><span class="c">Keyboard</span><span class="c">Controller</span></div>`;const rows=(sel,cell,sub={})=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span><span class="c"><span class="cell${i==sel&&cell==0?" on":""}">${sub[i+"k"]||a[1][0]}</span></span><span class="c"><span class="cell${i==sel&&cell==1?" on":""}">${sub[i+"p"]||a[2][0]}</span></span></div>`).join("");const L=(s,c,sub)=>`<div class="list">${head}${rows(s,c,sub)}<div class="r"><span class="n">Reset to defaults</span></div></div>`;page("Option A — the two actions swap","Giving Use / take the B key hands its old key E to Build list, and a line says so. Nothing is ever left without a key.",[
["Before: Use / take waiting, player presses B",scr(L(5,0,{"5k":"<span class=blink>Press a key… 4</span>"})),""],
["After",scr(L(5,0,{"5k":K("B"),"6k":K("E")})+`<div class="msg">Build list is now E</div>`+hint(K("Enter")+"Change "+K("Esc")+"Back")),"The line stays until the next press."]]);</script></body>
