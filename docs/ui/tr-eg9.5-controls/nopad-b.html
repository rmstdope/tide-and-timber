<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>page("Option B — Controller tab dimmed until a pad is connected","With no controller connected the Controller tab can be opened and read but its rows are dimmed, the highlight cannot reach them, and a line says why. Plugging a pad in brightens it at once.",[
["No controller",scr(TAB(1)+`<div class="list" style="opacity:.45">${ACT.map(a=>`<div class="r"><span class="n">${a[0]}</span><span class="c">${a[2][0]}</span></div>`).join("")}</div><div class="msg" style="bottom:44px;color:#ffe27a">Connect a controller to change these</div>`+hint(K("Q")+K("E")+"Tab "+K("Esc")+"Back")),"Reset hidden too."]]);</script></body>
