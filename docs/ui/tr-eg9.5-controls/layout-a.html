<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const rows=(sel,cell)=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span><span class="c"><span class="cell${i==sel&&cell==0?" on":""}">${a[1][0]}</span></span><span class="c"><span class="cell${i==sel&&cell==1?" on":""}">${a[2][0]}</span></span></div>`).join("");
const head=`<div class="r head"><span class="n"></span><span class="c">Keyboard</span><span class="c">Controller</span></div>`;
page("Option A — one list, a keyboard key and a controller button side by side","Every action on one page with one key and one button. Up/down pick the action, left/right pick keyboard or controller. The arrow keys always walk as well and are not shown. Cheapest to read; the arrow keys cannot be changed.",[
["Opened with the keyboard",scr(`<div class="list">${head}${rows(5,0)}<div class="r"><span class="n">Reset to defaults</span></div></div>`+hint(K("Enter")+"Change "+K("Esc")+"Back")),"Highlight on Use / take, keyboard side."],
["Pushed right on the pad",scr(`<div class="list">${head}${rows(5,1)}<div class="r"><span class="n">Reset to defaults</span></div></div>`+hint(A+"Change "+B+"Back")),"Same row, controller side."]]);</script></body>
