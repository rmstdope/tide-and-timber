<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const head=`<div class="r head"><span class="n"></span><span class="c">Keyboard</span><span class="c">Controller</span></div>`;const rows=(sel,cell,sub={})=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span><span class="c"><span class="cell${i==sel&&cell==0?" on":""}">${sub[i+"k"]||a[1][0]}</span></span><span class="c"><span class="cell${i==sel&&cell==1?" on":""}">${sub[i+"p"]||a[2][0]}</span></span></div>`).join("");const L=(s,c,sub)=>`<div class="list">${head}${rows(s,c,sub)}<div class="r"><span class="n">Reset to defaults</span></div></div>`;page("Option A — waits in the row itself","After Change, the slot says what to do and counts down. Any key is taken, Esc included. Doing nothing for 5 seconds leaves it as it was. Nothing covers the page; the countdown is the only way out besides pressing something.",[
["Waiting",scr(L(5,0,{"5k":"<span class=blink>Press a key… 5</span>"})+hint("Waiting for a key")),"The hint strip hides its buttons while waiting."],
["Pressed Q",scr(L(5,0,{"5k":K("Q")})+hint(K("Enter")+"Change "+K("Esc")+"Back")),"Saved at once."],
["5 seconds, nothing pressed",scr(L(5,0)+hint(K("Enter")+"Change "+K("Esc")+"Back")),"Back to E, nothing changed."]]);</script></body>
