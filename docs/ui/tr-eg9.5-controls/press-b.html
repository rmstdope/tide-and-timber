<!doctype html><meta charset=utf-8><link rel=stylesheet href=c.css><script src=c.js></script><body><script>const head=`<div class="r head"><span class="n"></span><span class="c">Keyboard</span><span class="c">Controller</span></div>`;const rows=(sel,cell,sub={})=>ACT.map((a,i)=>`<div class="r${i==sel?" sel":""}"><span class="n">${a[0]}</span><span class="c"><span class="cell${i==sel&&cell==0?" on":""}">${sub[i+"k"]||a[1][0]}</span></span><span class="c"><span class="cell${i==sel&&cell==1?" on":""}">${sub[i+"p"]||a[2][0]}</span></span></div>`).join("");const L=(s,c,sub)=>`<div class="list">${head}${rows(s,c,sub)}<div class="r"><span class="n">Reset to defaults</span></div></div>`;const bx=(l)=>`<div class="dim"></div><div class="box">${l}</div>`;
page("Option B — a box over the page","After Change, a box names the action and waits. A tap of any key is taken, Esc included; holding Esc for a second cancels (a ring fills, like the story skip). Clearer about what is happening, and no time pressure.",[
["Waiting",scr(L(5,0)+bx("<div>Use / take</div><div class=blink>Press a new key</div><div style=\"font-size:10px\">Hold "+K("Esc")+" to cancel</div>")),"On the pad: “Press a new button”, hold "+B+" to cancel."],
["Pressed Q",scr(L(5,0,{"5k":K("Q")})+hint(K("Enter")+"Change "+K("Esc")+"Back")),"Box closes, saved at once."],
["Held Esc",scr(L(5,0)+hint(K("Enter")+"Change "+K("Esc")+"Back")),"Box closes, nothing changed."]]);</script></body>
