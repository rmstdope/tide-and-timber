<!doctype html><html><head><meta charset="utf-8"><title>Scrolled list — no marks</title><script src="common.js"></script><script src="fit.js"></script></head><body><script>
const bare=s=>s.replace(/<text[^>]*>[▲▼]<\/text>/g,'');
page('A scrolled list shows nothing extra','Rows cut by the edge of the list are the only sign there is more. The list moves when the highlight reaches the edge.',[
 fig('At the top','No marks.',bare(settingsStack(0))),
 fig('Scrolled down','No marks.',bare(settingsStack(2,40))),
 fig('Controls page','No marks.',bare(controlsStack()))],
 'Cost: cleaner, but at Largest only two rows show, so a player may not know Colour cues and Controls exist below.');
