<!doctype html><html><head><meta charset="utf-8"><title>Sizes — option A</title><script src="common.js"></script></head><body><script>
page('Option A — three named steps each: Normal, Large, Largest','UI size makes the clock, item bar, hints, menus and boxes bigger (words grow with them). Text size makes only the words bigger; planks and boxes widen to fit. Three steps keep the pixel art sharp.',[
 fig('UI size Normal, Text size Normal','Today.',beach()+hud(1,1)),
 fig('UI size Large','Everything over the world ×1.5.',beach()+hud(1.5,1)),
 fig('UI size Largest','×2: the clock and bar take more of the beach.',beach()+hud(2,1)),
 fig('UI Normal, Text size Largest','Only words grow: his line, counts, hints.',beach()+hud(1,2))],
 'Recommended: few whole steps suit pixel art — in-between sizes blur or stagger pixels — and names read more easily than numbers.');
</script></body></html>
