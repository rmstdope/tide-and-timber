<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"><link rel="stylesheet" href="common.css"><title>Moving the selection</title><style>.menu .k{font-size:10px;color:#ffe27a;margin:0;padding:0}</style></head><body><h1 class="page">Pressing down while Quit is already selected</h1><div class="wrap">
<div><div class="screen"><div class="sky"></div><div class="sun"></div><div class="wave" style="left:40px;top:230px;width:60px"></div><div class="wave" style="left:380px;top:260px;width:90px"></div><div class="wave" style="left:200px;top:245px;width:40px"></div><div class="wreck"></div><div class="beach"></div><div class="palm" style="left:40px"></div><div class="menu" style="left:230px;top:240px;width:180px;text-align:center"><div class="plank sel">New Game</div><div class="plank">Quit</div></div></div><p class="cap"><b>Wraps round:</b> down from Quit goes back to New Game (and up from New Game goes to Quit).</p></div>
