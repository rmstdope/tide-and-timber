<!doctype html><html><head><meta charset="utf-8"><title>Twice as much island</title><script src="common.js"></script></head><body><script>
document.body.innerHTML=`<h1>Twice as much island in the same window</h1>
<p class="lede">The game draws its island into a picture 320 by 180 and magnifies it four times to fill a 1280 by 720 window. That picture becomes 640 by 360, magnified twice into the same window: the tiles stay the size they are, so the window frames about forty tiles across and twenty-two down instead of twenty by eleven, and everything appears at half its present size on screen. These pages are what we agreed about how that should look. Colours, figures, fonts and sizes are placeholders for the real pixel art.</p>

<p class="q">How big is what you read while you play? <span class="opt">chosen</span><a href="size.html">Half — the clock, item bar, key hints and his spoken lines shrink with the world</a></p>
<p>Rejected: the same size on screen (recommended, and turned down), and three-quarters — both on the same page.</p>

<p class="q">How big are the full-screen boards — pause, Settings, Controls, title menu, build list? <span class="opt">chosen</span><a href="boards2.html">Half, exactly as the playing screen: one size rule everywhere</a></p>
<p>Rejected: a step larger at three-quarters (recommended, and turned down), and today’s size — both on the same page. Earlier framing: <a href="boards.html">the boards beside today’s game</a>.</p>

<p class="q">What do Normal, Large and Largest mean now? <span class="opt">chosen</span><a href="steps.html">Three steps, unchanged in number: half, three-quarters, and exactly today’s size</a></p>
<p>Rejected: a fourth step half again as big as today; starting the ladder at three-quarters.</p>

<p class="q">The item bar, whose count digits are three pixels wide? <span class="opt">chosen</span><a href="bar.html">Halved like everything else, counts kept</a></p>
<p>Rejected: the bar alone staying at today’s size; halving it and dropping the counts.</p>

<p class="q">What do you see when he walks to the top or bottom of the island? <span class="opt">chosen</span><a href="edge.html">The view stops at the island’s edge and he walks up and down the screen</a></p>
<p>Rejected: keeping him centred with nothing beyond; keeping him centred with new scenery painted beyond.</p>

<p class="q">The title screen and the story pictures? <span class="opt">chosen</span><a href="pictures.html">Repainted at the new size, so their pixels match the island’s — more sky, more sea, the wreck at its true size</a></p>
<p>Rejected: keeping the pictures and doubling each pixel (recommended, and turned down); repainting the title only.</p>

<p class="q">The dark band behind the things he says? <span class="opt">chosen</span><a href="line.html">As wide as the words, centred — no longer a fixed width</a></p>
<p>Rejected: keeping it a fixed near-full width.</p>

<p class="q">Dragging the window smaller than the island? <span class="opt">chosen</span><a href="window.html">The window will not go below 640 by 360</a></p>
<p>Rejected: letting it shrink and cutting the picture off; letting the island shrink to fit, with pixels no longer square.</p>

<p class="q">Decided without asking</p>
<p>The gaps between the furniture and the window edges are measured in the game’s own pixels and shrink with everything else, so the clock and the hints sit closer to the corners than they do today. Full screen, the aspect ratio and the default 1280 by 720 window are all unchanged. The Colour cues setting is untouched. The Text size setting keeps its three words; nothing reads it yet.</p>`;
</script></body></html>
