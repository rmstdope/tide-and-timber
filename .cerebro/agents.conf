# What each agent runs on: which tool, which model, how hard it thinks. Written by
# .claude/cerebro/scripts/install and edited by hand; .claude/cerebro/agents.conf.example is the shape.
# The most specific line wins whole: the agent's own name, then its role, then `default'.

external glm-5.3-flash openai https://openrouter.ai/api/v1 ${OPENROUTER_API_KEY} z-ai/glm-5.3-flash

default      tool=claude  model=opus   effort=medium
implementer  tool=claude  model=opus   effort=low
verifier     tool=claude  model=opus   effort=low
architect    tool=claude  model=fable  effort=medium

#default      tool=copilot  model=gpt-5.6-terra	effort=medium
#implementer  tool=copilot  model=gpt-5.6-terra   effort=low
#verifier     tool=copilot  model=gpt-5.6-terra   effort=low
#architect    tool=copilot  model=gpt-5.6-sol    effort=medium
