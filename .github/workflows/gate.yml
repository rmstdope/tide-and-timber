name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Godot version
        run: godot --headless --version

      - name: Shell suites
        run: |
          set -euo pipefail
          for suite in scripts/tests/*-test.sh; do
            echo "::group::$suite"
            bash "$suite"
            echo "::endgroup::"
          done

      - name: gate-fast
        run: scripts/gate-fast
