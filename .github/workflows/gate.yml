name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 2

      - name: Changed paths
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/gated-tree"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(scripts/ci-gated "$tree")" = run=false ]; then
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=HEAD^1
          else
            base="$BEFORE"
            git fetch --no-tags --depth=1 origin "$base" || base=""
          fi
          paths=""
          if [ -n "$base" ]; then
            paths="$(git diff --name-only --no-renames "$base" HEAD)" || paths=""
          fi
          printf '%s\n' "$paths" | scripts/ci-needed >> "$GITHUB_OUTPUT"

      - name: Install Godot
        if: steps.changes.outputs.run == 'true'
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Godot version
        if: steps.changes.outputs.run == 'true'
        run: godot --headless --version

      - name: Shell suites
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          for suite in scripts/tests/*-test.sh; do
            echo "::group::$suite"
            bash "$suite"
            echo "::endgroup::"
          done

      - name: gate-fast
        if: steps.changes.outputs.run == 'true'
        run: scripts/gate-fast

      - name: Record the gated tree
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gated-tree-${{ steps.changes.outputs.tree }}
          path: ${{ runner.temp }}/gated-tree
          retention-days: 7
          if-no-files-found: error
